# Builds the PrintSaaS Agent installer for Windows and publishes it as a GitHub Release.
#   * Push a tag like  agent-v1.1.0  -> builds and publishes the release automatically.
#   * Or: Actions tab -> "Build PrintSaaS Agent" -> Run workflow (installer is attached to the run as an artifact).
# Permanent download link (latest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/PrintSaaS-Agent-Setup.exe
name: Build PrintSaaS Agent

on:
  workflow_dispatch:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install
        working-directory: agent
        run: npm ci
      - name: Build installer
        working-directory: agent
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build (see agent/README.md about the SmartScreen warning)
      - uses: actions/upload-artifact@v4
        with:
          name: PrintSaaS-Agent-Windows
          path: agent/dist/PrintSaaS-Agent-Setup.exe
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/PrintSaaS-Agent-Setup.exe
          generate_release_notes: true
