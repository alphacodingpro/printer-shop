# Local development / small self-hosted setup:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: printsaas
      POSTGRES_PASSWORD: printsaas
      POSTGRES_DB: printsaas
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printsaas"]
      interval: 5s
      retries: 10
  app:
    build: ./server
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development          # enables the fake "Test payment" button; use production when live
      DATABASE_URL: postgres://printsaas:printsaas@db:5432/printsaas
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret-1234}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeThisPassword123}
    volumes: [files:/data/storage]
volumes:
  dbdata:
  files:
